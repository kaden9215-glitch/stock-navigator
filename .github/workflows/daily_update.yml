name: Daily Stock RSI Auto Update

on:
  schedule:
    # 월~금(1-5) UTC 07:00 (한국 시간 평일 오후 4:00 장 마감 직후 자동 실행)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 즉시 실행해볼 수 있는 버튼 생성

permissions:
  contents: write # GitHub에 자동으로 수정된 json 파일을 저장(Push)할 권한 부여

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 구축
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 필수 패키지 설치
        run: |
          pip install yfinance pandas

      - name: 4. RSI 계산 스크립트 실행
        run: |
          python update_stocks.py

      - name: 5. 갱신된 stocks.json을 깃허브에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git commit -m "Auto: Update stock RSI data [skip ci]" || echo "변경 사항 없음"
          git push
