name: Daily Stock RSI Auto Update

on:
  schedule:
    # 한국 시간 평일 오후 4:00 (UTC 07:00, 월~금)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 파이썬 환경 구축
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 필수 패키지 설치
        run: |
          pip install requests beautifulsoup4 pandas yfinance

      - name: 4. 주식 지표 연산 스크립트 실행
        run: |
          python update_stocks.py

      - name: 5. 갱신된 stocks.json 안전 자동 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Update stock RSI & Disparity data [skip ci]"
          file_pattern: 'stocks.json'
